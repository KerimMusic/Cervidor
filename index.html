<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sain Nt</title>
    <link rel="stylesheet" href="estilo.css" />
</head>
<body>
    <!-- ===== CONTENEDOR PRINCIPAL (formulario + galería) ===== -->
    <div id="contenedor-principal">
        <!-- FORMULARIO (visible por defecto) -->
        <div id="formulario">
            <img src="https://www.professionalbarber.shop/wp-content/uploads/2023/08/shutterstock_1647990784-1.png" alt="Imagen de cita" class="imagen-cita" />
            <h1>AGENDA TU CITA</h1>

            <input type="text" id="nombreInput" placeholder="Nombre completo..." required />
            <label class="label-banner" for="fechaInput">📅 Fecha</label>
            <input type="date" id="fechaInput" required />
            <label class="label-banner" for="horaInput">🕒 Hora</label>
            <input type="time" id="horaInput" required />
            <input type="text" id="servicioInput" placeholder="Servicio (ej. Corte + Barba)..." />
            <button id="agendarBtn">Agendar</button>
        </div>

        <!-- GALERÍA DE FOTOS (OCULTA POR DEFECTO) -->
        <div id="galeria-container">
            <h2 class="galeria-titulo">📸 Fotos de nuestros cortes</h2>
            <div class="galeria-grid">
                <img src="https://www.dropbox.com/scl/fi/t5e2kv6c7dzmcfyq52ayu/Corte1.jpg?rlkey=bt4yn0mf8q2khg3udoky1t9o9&st=n798a9pm&raw=1" alt="Corte 1" class="galeria-foto" />
                <img src="" alt="Corte 2" class="galeria-foto" />
                <img src="" alt="Corte 3" class="galeria-foto" />
                <img src="" alt="Corte 4" class="galeria-foto" />
                <img src="" alt="Corte 5" class="galeria-foto" />
                <img src="" alt="Corte 6" class="galeria-foto" />
                <img src="" alt="Corte 7" class="galeria-foto" />
                <img src="" alt="Corte 8" class="galeria-foto" />
                <img src="" alt="Corte 9" class="galeria-foto" />
            </div>
        </div>
    </div>

    <!-- BOTÓN "VER MÁS" (siempre visible) -->
    <button id="button2">Ver más</button>

    <script src="script.js"></script>
</body>
</html>
