<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sain Nt</title>
    <link rel="stylesheet" href="estilo.css" />
</head>
<body>
    <!-- ===== CONTENEDOR PRINCIPAL (formulario + galería) ===== -->
    <div id="contenedor-principal">
        <!-- FORMULARIO (visible por defecto) -->
        <div id="formulario">
            <img src="https://www.dropbox.com/scl/fi/gk9ovs454q5nmxohsvfz5/Perfil.jpg?rlkey=qo2ha5it6e7pp2cpmdbgvv3h8&st=v2gquohz&raw=1" alt="Imagen de cita" class="imagen-cita" />
            <h1>AGENDA TU CITA</h1>

            <input type="text" id="nombreInput" placeholder="Nombre completo..." required />
            <label class="label-banner" for="fechaInput">📅 Fecha</label>
            <input type="date" id="fechaInput" required />
            <label class="label-banner" for="horaInput">🕒 Hora</label>
            <input type="time" id="horaInput" required />
            <input type="text" id="servicioInput" placeholder="Servicio (ej. Corte + Barba)..." />
            <button id="agendarBtn">Agendar</button>
        </div>

        <!-- GALERÍA DE FOTOS (OCULTA POR DEFECTO) -->
        <div id="galeria-container">
            <h2 class="galeria-titulo">📸 Fotos de nuestros cortes</h2>
            <div class="galeria-grid">
                <img src="https://www.dropbox.com/scl/fi/rebb2rkv8m1qwoywlo11x/Corte1.jpg?rlkey=35dyonvdhmhlpkt315h1ktj0w&st=x33bgt6k&raw=1" alt="Corte 1" class="galeria-foto" />
                <img src="https://www.dropbox.com/scl/fi/h7a01fz50btt3uraj9sbn/Corte2.jpg?rlkey=eo72pn3oqjks4arxpb14tcs82&st=zh1ozt8t&raw=1" alt="Corte 2" class="galeria-foto" />
                <img src="https://www.dropbox.com/scl/fi/o0qcbgrgojm6f21iariqy/Corte3.jpg?rlkey=83l7flxjhtm822s25ouggsphu&st=lciu3ddf&raw=1" alt="Corte 3" class="galeria-foto" />
                <img src="https://www.dropbox.com/scl/fi/fuzi708csgy3k9ri1jt11/Corte4.jpg?rlkey=x192fbt3ss76ifsrvoroagul5&st=v8ja7fie&raw=1" alt="Corte 4" class="galeria-foto" />
                <img src="https://www.dropbox.com/scl/fi/1bytz9dvdk6gybdmdzhyf/Corte5.jpg?rlkey=3t747ysejq23qeg1u5rkk6ebt&st=7eobbdil&raw=1" alt="Corte 5" class="galeria-foto" />
            </div>
        </div>
    </div>

    <!-- BOTÓN "VER MÁS" (siempre visible) -->
    <button id="button2">Ver más</button>

    <script src="script.js"></script>
</body>
</html>
